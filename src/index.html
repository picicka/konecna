<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no">
    <meta name="theme-color" content="#050806">
    <!-- Celá obrazovka na mobilu: po přidání na plochu běží hra bez lišt prohlížeče (iPhone Safari jinak celou obrazovku neumí). -->
    <link rel="manifest" href="manifest.webmanifest?v=2">
    <meta name="mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Konečná">
    <!-- Ikona na plochu a do záložky. Adresa má verzi (?v=), protože iPhone si ikonu drží v mezipaměti velmi dlouho. -->
    <link rel="apple-touch-icon" sizes="180x180" href="apple-touch-icon.png?v=2">
    <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png?v=2">
    <title>Konečná. Nevystupovat.</title>
    <meta name="description" content="Postapokalyptické pixel-artové RPG po Praze. Kurýrka, zásilka z Hlaváku na Hrad a město, které už nikdo nepozná.">
    <meta property="og:type" content="website">
    <meta property="og:title" content="Konečná. Nevystupovat.">
    <meta property="og:description" content="Postapokalyptické pixel-artové RPG po Praze.">
    <meta property="og:image" content="images/cs_city.png">
    <meta property="og:locale" content="cs_CZ">
    <!-- Pixelová písma: Press Start 2P na nadpisy, VT323 (terminál) na text. Bunny Fonts bez sledování. -->
    <link rel="preconnect" href="https://fonts.bunny.net">
    <link rel="stylesheet" href="https://fonts.bunny.net/css?family=press-start-2p:400|vt323:400">
    <style>
        /* Jedno místo pro layout: plátno 1280 × 720 centruje CSS, Phaser ho jen škáluje (FIT, bez vlastního centrování). */
        html, body { margin: 0; height: 100%; height: 100dvh; background: #050806; color: #9fe8b0; overflow: hidden; font-family: 'VT323', ui-monospace, monospace; }
        /* Obal drží hru ve viditelné části okna: na mobilu ho main.js přichytí k visualViewport (lišty prohlížeče), okraje
           respektují výřez a spodní proužek (safe-area). Phaser měří vnitřní [data-konecna], tedy plochu bez okrajů. */
        [data-shell] { position: fixed; left: 0; top: 0; width: 100vw; height: 100vh; height: 100dvh; box-sizing: border-box; display: flex; background: #050806;
            padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left); }
        [data-konecna] { flex: 1; min-width: 0; min-height: 0; display: flex; align-items: center; justify-content: center; touch-action: none; }
        [data-konecna] canvas { display: block; image-rendering: pixelated; image-rendering: crisp-edges; }
        [data-fontload] { position: absolute; left: -9999px; top: 0; font-family: 'Press Start 2P'; }
        [data-fontload] span { font-family: 'VT323'; }
    </style>
    <script type="module" src="/main.js"></script>
</head>
<body>
    <div data-shell><div data-konecna aria-label="Konečná. Nevystupovat."></div></div>
    <div data-fontload aria-hidden="true">Konečná ěščřžýáíéúůďťň ĚŠČŘŽŮĎŤŇ <span>Nevystupovat ěščřžýáíéúůďťň ĚŠČŘŽŮĎŤŇ „“–…</span></div>
</body>
</html>
